name: Render documentary intro
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: remotion-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx remotion render TyphoonVsRafaleIntro out/intro.mp4 --codec=h264 --crf=20 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: typhoon-rafale-intro-1080p
          path: remotion-app/out/intro.mp4
          retention-days: 14
